name: Build AppImage

# Runs automatically when you push a version tag (e.g. v1.1.2),
# and can also be started by hand from the Actions tab.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write   # needed to attach the AppImage to the release

jobs:
  build:
    # Oldest supported Ubuntu LTS -> glibc 2.35, so the AppImage runs on
    # Ubuntu 22.04+, Debian 12, Mint 21, Pop!_OS 22.04, and anything newer.
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-cursor0 file

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build with PyInstaller
        run: |
          pyinstaller --noconfirm --windowed --name Auris \
            --add-data "auris.png:." \
            app.py

      - name: Remove font libraries (use the system's copies instead)
        run: |
          find dist/Auris/_internal -name 'libfontconfig.so*' -delete
          find dist/Auris/_internal -name 'libfreetype.so*' -delete

      - name: Bundle libxcb-cursor (so users don't need to install it)
        run: |
          cp -L /usr/lib/x86_64-linux-gnu/libxcb-cursor.so.0 dist/Auris/_internal/
          if [ -d dist/Auris/_internal/PySide6/Qt/lib ]; then
            cp -L /usr/lib/x86_64-linux-gnu/libxcb-cursor.so.0 dist/Auris/_internal/PySide6/Qt/lib/
          fi

      - name: Assemble AppDir
        run: |
          mkdir -p AppDir/usr/bin
          cp -r dist/Auris/* AppDir/usr/bin/
          cp auris.png AppDir/usr/bin/
          cp auris.png AppDir/auris.png

          cat > AppDir/auris.desktop << 'EOF'
          [Desktop Entry]
          Type=Application
          Name=Auris
          Comment=Audio library scanner: detects fake lossless files, clipping and dynamic range issues
          Exec=Auris
          Icon=auris
          Categories=AudioVideo;Audio;
          Terminal=false
          EOF
          sed -i 's/^[[:space:]]*//' AppDir/auris.desktop

          cat > AppDir/AppRun << 'EOF'
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "$0")")"
          exec "$HERE/usr/bin/Auris" "$@"
          EOF
          sed -i 's/^[[:space:]]*//' AppDir/AppRun
          chmod +x AppDir/AppRun

      - name: Package with the current appimagetool (static runtime, no libfuse2 needed)
        run: |
          wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage
          APPIMAGE_EXTRACT_AND_RUN=1 ARCH=x86_64 ./appimagetool-x86_64.AppImage AppDir Auris-x86_64.AppImage

      - name: Keep a copy as a workflow artifact
        uses: actions/upload-artifact@v5
        with:
          name: Auris-x86_64.AppImage
          path: Auris-x86_64.AppImage

      - name: Attach to the GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: Auris-x86_64.AppImage
