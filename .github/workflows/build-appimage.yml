name: Build AppImage

# Runs automatically when you push a version tag (e.g. v1.1.2),
# and can also be started by hand from the Actions tab.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write   # needed to attach the AppImage to the release

jobs:
  build:
    # Oldest supported Ubuntu LTS -> glibc 2.35, so the AppImage runs on
    # Ubuntu 22.04+, Debian 12, Mint 21, Pop!_OS 22.04, and anything newer.
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y file \
            libxcb-cursor0 libxkbcommon-x11-0 libxcb-icccm4 libxcb-util1 \
            libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-shape0 \
            libxcb-xkb1 libegl1

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build with PyInstaller
        run: |
          pyinstaller --noconfirm --windowed --name Auris \
            --add-data "auris.png:." \
            app.py

      - name: Remove font libraries (use the system's copies instead)
        run: |
          find dist/Auris/_internal -name 'libfontconfig.so*' -delete
          find dist/Auris/_internal -name 'libfreetype.so*' -delete

      - name: Bundle the X11 and EGL libraries Qt needs to open a window
        # These aren't present on every system (e.g. minimal installs and the
        # AppImage catalog's test machine), so ship them inside the AppImage.
        run: |
          LIBDIR=/usr/lib/x86_64-linux-gnu
          QTLIB=dist/Auris/_internal/PySide6/Qt/lib
          for lib in libxcb-cursor.so.0 libxkbcommon-x11.so.0 libxkbcommon.so.0 \
                     libxcb-icccm.so.4 libxcb-util.so.1 libxcb-image.so.0 \
                     libxcb-keysyms.so.1 libxcb-render-util.so.0 libxcb-shape.so.0 \
                     libxcb-xkb.so.1 libEGL.so.1 libGLdispatch.so.0; do
            if [ -e "$LIBDIR/$lib" ]; then
              cp -L "$LIBDIR/$lib" dist/Auris/_internal/
              [ -d "$QTLIB" ] && cp -L "$LIBDIR/$lib" "$QTLIB/"
              echo "Bundled $lib"
            else
              echo "WARNING: $lib not found on build machine"
            fi
          done

      - name: Assemble AppDir
        run: |
          mkdir -p AppDir/usr/bin
          cp -r dist/Auris/* AppDir/usr/bin/
          cp auris.png AppDir/usr/bin/
          cp auris.png AppDir/auris.png

          cat > AppDir/auris.desktop << 'EOF'
          [Desktop Entry]
          Type=Application
          Name=Auris
          Comment=Audio library scanner: detects fake lossless files, clipping and dynamic range issues
          Exec=Auris
          Icon=auris
          Categories=AudioVideo;Audio;
          Terminal=false
          EOF
          sed -i 's/^[[:space:]]*//' AppDir/auris.desktop

          cat > AppDir/AppRun << 'EOF'
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "$0")")"
          exec "$HERE/usr/bin/Auris" "$@"
          EOF
          sed -i 's/^[[:space:]]*//' AppDir/AppRun
          chmod +x AppDir/AppRun

      - name: Package with the current appimagetool (static runtime, no libfuse2 needed)
        run: |
          wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage
          APPIMAGE_EXTRACT_AND_RUN=1 ARCH=x86_64 ./appimagetool-x86_64.AppImage \
            -u "gh-releases-zsync|noisetta|auris|latest|Auris-x86_64.AppImage.zsync" \
            AppDir Auris-x86_64.AppImage

      - name: Keep a copy as a workflow artifact
        uses: actions/upload-artifact@v5
        with:
          name: Auris-x86_64.AppImage
          path: Auris-x86_64.AppImage

      - name: Attach to the GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Auris-x86_64.AppImage
            Auris-x86_64.AppImage.zsync

  # Diagnostic: launch the AppImage on a clean Ubuntu 22.04 machine (like the
  # AppImage catalog's test bot does) and print everything it says.
  # This job never blocks the release; it's only here to show what goes wrong.
  test:
    needs: build
    runs-on: ubuntu-22.04
    continue-on-error: true
    steps:
      - uses: actions/download-artifact@v6
        with:
          name: Auris-x86_64.AppImage

      - name: Install a virtual screen and firejail (nothing else)
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb firejail

      - name: Check for missing libraries in the Qt window plugin
        run: |
          chmod +x Auris-x86_64.AppImage
          ./Auris-x86_64.AppImage --appimage-extract > /dev/null
          PLUGIN=$(find squashfs-root -name 'libqxcb.so' | head -n 1)
          echo "Plugin: $PLUGIN"
          ldd "$PLUGIN" | grep "not found" || echo "No missing libraries for the xcb plugin"
          echo "--- Missing libraries anywhere in the bundle ---"
          find squashfs-root -name '*.so*' -type f -exec ldd {} \; 2>/dev/null | grep "not found" | sort -u || echo "None"

      - name: Launch normally (15 seconds)
        run: |
          QT_DEBUG_PLUGINS=1 timeout 15 xvfb-run -a ./Auris-x86_64.AppImage 2>&1 | tail -n 80
          echo "Exit code: ${PIPESTATUS[0]} (124 means it was still running after 15 s, which is good)"

      - name: Launch inside firejail, like the catalog bot (15 seconds)
        run: |
          QT_DEBUG_PLUGINS=1 timeout 15 xvfb-run -a firejail --noprofile --appimage ./Auris-x86_64.AppImage 2>&1 | tail -n 80
          echo "Exit code: ${PIPESTATUS[0]} (124 means it was still running after 15 s, which is good)"
